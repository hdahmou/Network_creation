[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-creation"
version = "0.1.0"
description = "Network creation based on information decay."
readme = "README.md"
authors = [
    {name = "Hicham DAHMOU"}
]
requires-python = ">=3.13"
dependencies = [
    "dask==2026.3.0",
    "distributed==2026.3.0",
    "igraph>=1.0.0",
    "mypy>=1.19.1",
    "netgraph>=4.13.2",
    "notebook>=6.4.12",
    "numpy>=2.0.0",
    "pytest>=9.0.2",
    "scipy>=1.17.1",
    "sbi>=0.25.0",
    "scienceplots>=2.2.1",
    "zarr==3.1.5",
    "bokeh>=3.9.0",
    "matplotlib-label-lines>=0.8.1",
]

[project.scripts]
network-creation-dispatcher = "tasks.dispatch:main"

[tool.setuptools.packages.find]
include = ["network_creation*", "tasks*"]

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["igraph"]
ignore_missing_imports = true
